name: Hoa Lo Facebook Analysis Pipeline

on:
  push:
    branches: [main, develop]
    paths: ["src/**", "data/**", "config/**", "requirements.txt"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      skip_scrape:
        description: "Skip fetching data from Apify"
        type: boolean
        default: false
      trigger_new_crawl:
        description: "Trigger NEW Apify crawl (slow ~15min)"
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check src/ --output-format=github

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - run: pytest tests/ -v --cov=src || true

  fetch-data:
    name: Fetch Data from Apify
    runs-on: ubuntu-latest
    needs: lint
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_scrape != 'true')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install apify-client pandas pyyaml python-dotenv
      - name: Fetch data
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.trigger_new_crawl }}" = "true" ]; then
            python src/scraper.py --output data/raw --config config/pipeline.yaml --trigger
          else
            python src/scraper.py --output data/raw --config config/pipeline.yaml
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: raw-data
          path: data/raw/
          retention-days: 90

  clean-data:
    name: Clean Raw Data
    runs-on: ubuntu-latest
    needs: [test, fetch-data]
    if: always() && needs.test.result == 'success' && (needs.fetch-data.result == 'success' || needs.fetch-data.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: raw-data
          path: data/raw/
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pandas numpy
      - run: python src/clean_data.py --input data/raw --output data/cleaned
      - run: |
          python -c "
          import pandas as pd
          df = pd.read_csv('data/cleaned/posts_cleaned.csv')
          print(f'OK: {len(df)} posts, {df[\"engagement_total\"].sum():,} engagement')
          "
      - uses: actions/upload-artifact@v4
        with:
          name: cleaned-data
          path: data/cleaned/

  nlp-and-report:
    name: NLP Analysis & Report
    runs-on: ubuntu-latest
    needs: clean-data
    if: needs.clean-data.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cleaned-data
          path: data/cleaned/
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-nlp-${{ hashFiles('requirements.txt') }}
      - name: Cache underthesea
        uses: actions/cache@v4
        with:
          path: ~/.underthesea
          key: ${{ runner.os }}-underthesea-v2
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run NLP Analysis
        run: |
          python src/nlp_analysis.py \
            --input data/cleaned \
            --output data/results \
            --figures reports/figures \
            --topics 7
      - name: Show results
        run: |
          python -c "
          import json
          with open('data/results/nlp_analysis_report.json') as f:
              r = json.load(f)
          print('=== NLP Results ===')
          print(f\"Posts: {r['dataset']['total_posts']}\")
          print(f\"Topics: {r['topics']['num_topics']}, best: Topic {r['topics']['best_topic']}\")
          for s in ['positive', 'neutral', 'negative']:
              print(f\"  {s}: {r['sentiment'][s]['pct']}%\")
          print(f\"Best sentiment for engagement: {r['insights']['best_sentiment']}\")
          "
      - uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.sha }}
          path: |
            reports/
            data/results/
          retention-days: 30
