name: Hoa Lo Facebook Analysis Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "data/vietnamese_stopwords.txt"
      - "config/**"
      - "requirements.txt"
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      skip_scrape:
        description: "Skip fetching data from Apify"
        type: boolean
        default: false
      trigger_new_crawl:
        description: "Trigger NEW Apify crawl (slow ~15min)"
        type: boolean
        default: false
      send_email:
        description: "Send report via email"
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('requirements.txt') }}
      - name: Install lint tools
        run: pip install ruff nbstripout nbqa
      - name: Ruff check source
        run: ruff check src/ --output-format=github
      - name: Ruff check notebooks
        run: nbqa ruff notebooks/ --output-format=github
        continue-on-error: true

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run tests
        run: pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  fetch-data:
    name: Fetch Data from Apify
    runs-on: ubuntu-latest
    needs: lint
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_scrape != 'true')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install apify-client pandas pyyaml python-dotenv
      - name: Fetch data from Apify
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.trigger_new_crawl }}" = "true" ]; then
            python src/scraper.py --output data/raw --config config/pipeline.yaml --trigger
          else
            python src/scraper.py --output data/raw --config config/pipeline.yaml
          fi
      - name: Upload raw data
        uses: actions/upload-artifact@v4
        with:
          name: raw-data
          path: data/raw/
          retention-days: 90

  clean-data:
    name: Clean Raw Data
    runs-on: ubuntu-latest
    needs: [test, fetch-data]
    if: always() && needs.test.result == 'success' && (needs.fetch-data.result == 'success' || needs.fetch-data.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - name: Download raw data
        uses: actions/download-artifact@v4
        with:
          name: raw-data
          path: data/raw/
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install pandas pyyaml
      - name: Run data cleaning
        run: python src/clean_data.py --input data/raw --output data/cleaned --config config/pipeline.yaml
      - name: Validate cleaned data
        run: |
          python -c "
          import pandas as pd, sys
          from pathlib import Path

          csv_path = Path('data/cleaned/posts_cleaned.csv')
          if not csv_path.exists():
              print('FAIL: posts_cleaned.csv not found')
              sys.exit(1)

          df = pd.read_csv(csv_path)
          required = ['postId', 'datetime', 'text', 'engagement_total', 'media_type']
          missing = set(required) - set(df.columns)
          if missing:
              print(f'FAIL: missing columns: {missing}')
              sys.exit(1)

          print(f'OK: {len(df)} posts, {len(df.columns)} cols')
          print(f'  Date: {df[\"date\"].min()} → {df[\"date\"].max()}')
          print(f'  With text: {df[\"has_text\"].sum()}')
          print(f'  Engagement: {df[\"engagement_total\"].sum():,}')
          "
      - name: Upload cleaned data
        uses: actions/upload-artifact@v4
        with:
          name: cleaned-data
          path: data/cleaned/

  nlp-pipeline:
    name: NLP & Sentiment Analysis
    runs-on: ubuntu-latest
    needs: clean-data
    if: needs.clean-data.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Download cleaned data
        uses: actions/download-artifact@v4
        with:
          name: cleaned-data
          path: data/cleaned/
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-nlp-${{ hashFiles('requirements.txt') }}
      - name: Cache underthesea models
        uses: actions/cache@v4
        with:
          path: ~/.underthesea
          key: ${{ runner.os }}-underthesea-v2
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Step 1 — Preprocessing
        run: python src/preprocessing.py --input data/cleaned --output data/processed --config config/pipeline.yaml
      - name: Step 2 — Sentiment Analysis
        run: python src/sentiment.py --input data/processed --output data/results/sentiment --config config/pipeline.yaml
      - name: Step 3 — LDA Topic Modeling
        run: python src/topic_modeling.py --input data/processed --output data/results/topics --config config/pipeline.yaml
      - name: Validate sentiment
        run: |
          python -c "
          import pandas as pd, sys
          from pathlib import Path

          for f in Path('data/results/sentiment').glob('*_sentiment.csv'):
              df = pd.read_csv(f)
              dist = df['sentiment'].value_counts(normalize=True) * 100
              print(f'=== {f.stem} ===')
              for label in ['neutral', 'positive', 'negative']:
                  print(f'  {label}: {dist.get(label, 0):.1f}%')
          print('Validation passed')
          "
      - name: Upload NLP results
        uses: actions/upload-artifact@v4
        with:
          name: nlp-results
          path: |
            data/processed/
            data/results/

  build-report:
    name: Build Report & Cross Analysis
    runs-on: ubuntu-latest
    needs: nlp-pipeline
    if: github.ref == 'refs/heads/main' && needs.nlp-pipeline.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Download cleaned data
        uses: actions/download-artifact@v4
        with:
          name: cleaned-data
          path: data/cleaned/
      - name: Download NLP results
        uses: actions/download-artifact@v4
        with:
          name: nlp-results
          path: .
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Cross Analysis (Topic × Sentiment × Engagement)
        run: |
          python src/cross_analysis.py \
            --sentiment data/results/sentiment \
            --topics data/results/topics \
            --cleaned data/cleaned \
            --output data/results/cross_analysis \
            --figures reports/figures \
            --config config/pipeline.yaml
      - name: Generate visualizations
        run: |
          python src/visualize.py \
            --sentiment data/results/sentiment \
            --topics data/results/topics \
            --raw data/cleaned \
            --output reports/figures
      - name: Generate strategy report
        run: |
          python src/strategy.py \
            --raw data/cleaned \
            --sentiment data/results/sentiment \
            --topics data/results/topics \
            --config config/pipeline.yaml \
            --output reports/strategy_report.md
      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.sha }}
          path: |
            reports/
            data/results/cross_analysis/
          retention-days: 30

  send-email:
    name: Send Report via Email
    runs-on: ubuntu-latest
    needs: build-report
    if: |
      needs.build-report.result == 'success' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.send_email == 'true'))
    steps:
      - uses: actions/checkout@v4
      - name: Download report
        uses: actions/download-artifact@v4
        with:
          name: report-${{ github.sha }}
          path: reports/
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install pyyaml python-dotenv jinja2
      - name: Send email
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        run: python src/email_sender.py --config config/pipeline.yaml --report reports/strategy_report.md --figures reports/figures
